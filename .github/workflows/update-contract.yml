name: Update contract

on:
  repository_dispatch:
    types: [contract-released]
  workflow_dispatch:
    inputs:
      contract_tag:
        description: Contract tag such as v0.1.3
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CONTRACT_TAG: ${{ github.event.client_payload.tag || inputs.contract_tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Download pinned contract release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CONTRACT_TAG" --repo lingya-ai/lingya-agents-openapi --pattern lingya-agents-v1.yaml --output openapi/lingya-agents-v1.yaml --clobber
          gh release download "$CONTRACT_TAG" --repo lingya-ai/lingya-agents-openapi --pattern endpoints.json --output openapi/endpoints.json --clobber
      - run: ./gradlew clean check
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/contract-${{ env.CONTRACT_TAG }}
          commit-message: "chore: update contract to ${{ env.CONTRACT_TAG }}"
          title: "chore: update contract to ${{ env.CONTRACT_TAG }}"
          body: "Regenerates the SDK from lingya-agents-openapi `${{ env.CONTRACT_TAG }}` and runs the complete SDK verification suite."
