name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - run: ./gradlew clean check
      - name: Verify generated sources are committed
        run: git diff --exit-code
      - name: Verify local Maven publication
        if: matrix.java == 17
        run: ./gradlew publishToMavenLocal
      - name: Compile fresh Kotlin and Java consumers
        if: matrix.java == 17
        run: ./gradlew -p consumer-tests clean build
